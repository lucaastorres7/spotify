services:
  app:
    build: .
    container_name: fastapi-template
    ports:
      - "8000:8000"
    env_file:
      - .env
  
  db:
    image: postgres:18
    container_name: spotify-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - spotify-db-data:/var/lib/postgresql

volumes:
  spotify-db-data: